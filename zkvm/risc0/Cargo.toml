[package]
name    = "zkdcap-risc0"
version = "0.1.0"
edition = "2021"

[package.metadata.risc0]
methods = ["guest"]

[[bin]]
name = "lightweight_host"
path = "lightweight_host.rs"

[[bin]]
name = "generate_true_groth16_proof"
path = "generate_true_groth16_proof.rs"

[[bin]]
name = "extract_from_bin"
path = "extract_from_bin.rs"

[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["prove"] }
dcap-quote-verifier = { path = "../../crates/quote-verifier" }
dcap-pcs = { path = "../../crates/pcs" }
base64 = "0.22"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
hex = "0.4"
num_cpus = "1.0"

[build-dependencies]
risc0-build  = { version = "=3.0.3", features = ["unstable"] }
risc0-binfmt = { version = "3.0.2", default-features = false }

[dev-dependencies]
risc0-zkvm          = { version = "=3.0.3", default-features = false, features = ["prove"] }
hex                 = { version = "0.4", default-features = false, features = ["alloc"] }
dcap-quote-verifier = { path = "../../crates/quote-verifier" }

[features]
default = []
cuda = ["risc0-zkvm/cuda"]
