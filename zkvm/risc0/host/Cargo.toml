[package]
name = "zkdcap-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "host_example"
path = "../host_example.rs"

[dependencies]
# RISC Zero dependencies
risc0-zkvm = { version = "=3.0.3", features = ["prove"] }

# DCAP dependencies
dcap-quote-verifier = { path = "../../../crates/quote-verifier" }
dcap-pcs = { path = "../../../crates/pcs" }

# Utility dependencies
base64 = "0.22"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
bincode = "1.3"

[profile.release]
lto = "thin"
