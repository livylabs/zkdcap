[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
fs_permissions = [{ access = "read", path = "./data" }]

# RPC endpoints
[rpc_endpoints]
sepolia = "https://rpc.ankr.com/eth_sepolia/faf5b94f5b6d0c334b2ae92398d498a799e9c682c390b02050c325fb55425b0b"
alchemy_sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# Etherscan API keys for verification
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# Gas settings
[profile.gas_reports]
enabled = true
reports = ["*"]

# Test settings
[profile.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

# Fuzz testing
[profile.fuzz]
runs = 1000
max_test_rejects = 65536
seed = '0x3e8'
dictionary_weight = 40
include_storage = true
include_push_bytes = true

# Invariant testing
[profile.invariant]
runs = 256
depth = 15
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true

# Coverage
[profile.coverage]
report = "lcov"
report_file = "lcov.info"
summary = true
details = "nested"